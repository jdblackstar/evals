[project]
name = "evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.9.post3",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["environments/pipeline_debugger", "environments/repo_health_audit"]
testpaths = [
    "environments/pipeline_debugger/tests",
    "environments/repo_health_audit/tests",
]
addopts = "--import-mode=importlib"
norecursedirs = [
    "instances",
    "outputs",
    ".venv",
    ".uv-cache",
    "generator/template_pipeline",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]
