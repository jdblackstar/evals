[project]
name = "dataforge-platform"
version = "2.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "sqlalchemy",
    "psycopg2-binary",
    "fastapi",
    "uvicorn",
    "celery",
    "redis",
    "pydantic",
    "structlog",
    "boto3",
    "click",
    "pyarrow",
    "duckdb",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["services"]
