[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform"
version = "0.3.0"
description = "Data pipeline platform with ingest, transform, and export stages"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "structlog>=23.2.0",
    "boto3>=1.34.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "nox>=2023.4.22",
    "ruff>=0.1.0",
]
