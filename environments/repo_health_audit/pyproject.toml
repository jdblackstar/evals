[project]
name = "repo-health-audit"
description = "Audit repository health under tool availability constraints with grounded evidence checks."
tags = ["eval", "audit", "tools"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "verifiers>=0.1.9.post3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["repo_health_audit/**", "README.md", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 23
rollouts_per_example = 1
